name: rewirex
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  image_picker: ^1.2.1

  firebase_auth: ^6.3.0        
  firebase_core: ^4.6.0
  cloud_firestore: ^6.2.0

  # Push Notifications
  firebase_messaging: ^16.1.3

  # Local Notifications
  flutter_local_notifications: ^20.1.0

  # State Management
  provider: ^6.1.2

  # Date formatting
  intl: ^0.20.2

  # UUID generator
  uuid: ^4.4.0

  fl_chart: ^1.2.0

  http: ^1.2.1

  firebase_storage: ^13.2.0

  path: ^1.9.0

  flutter_image_compress: ^2.3.0

  url_launcher: ^6.3.0

  shared_preferences: ^2.2.2

  # ── NEW: Google Sign-In ──────────────────────────────────────
  google_sign_in: ^7.2.0

  # ── NEW: Apple Sign-In ───────────────────────────────────────
  sign_in_with_apple: ^7.0.1

  # ── NEW: Crypto (required by sign_in_with_apple) ─────────────
  crypto: ^3.0.3
  firebase_app_check: ^0.4.2
  youtube_player_flutter: ^10.0.1
  just_audio: ^0.10.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true

  assets:
    - assests/icon.png
    - assests/audio/  

# ══════════════════════════════════════════════════════════════
# APP ICON CONFIG (used by flutter_launcher_icons package)
# Source: /home/himanshu/Projects/rewirex/assests/icon.png
# ══════════════════════════════════════════════════════════════
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assests/icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#0D0D1A"
  adaptive_icon_foreground: "assests/icon.png"